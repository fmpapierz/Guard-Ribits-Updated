plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        url = "https://maven.terraformersmc.com/releases/"
        content { includeGroup "com.terraformersmc" }
    }
    maven {
        name = 'Quilt'
        url = 'https://maven.quiltmc.org/repository/release'
    }
}

// Quilt Loader reads Fabric mods natively, so the Quilt build shares the Fabric
// sources and simply ships an extra quilt.mod.json manifest alongside them.
sourceSets {
    main {
        java.srcDir project(':fabric').file('src/main/java')
        resources.srcDir project(':fabric').file('src/main/resources')
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    implementation "com.geckolib:geckolib-fabric-$rootProject.minecraft_version:$rootProject.geckolib_version"
    implementation files("$rootProject.projectDir/libs/ribbits-fabric-${rootProject.ribbits_version}.jar")

    // Without remapping there is no namedElements variant, so the plain project is used.
    common(project(':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    // The access widener lives in the common module; each loader jar gets a copy.
    from(project(':common').file('src/main/resources/guardribbits.accesswidener'))

    filesMatching(['fabric.mod.json', 'quilt.mod.json']) {
        expand version: project.version
    }

    // The Fabric source set is shared; both manifests are kept so the jar loads on
    // Quilt Loader (quilt.mod.json) and stays usable on Fabric Loader (fabric.mod.json).
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Minecraft is unobfuscated, so Loom performs no remap step: the shadowed jar that
// bundles the common module is the distributable artifact.
shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
}

jar {
    archiveClassifier = 'thin'
}

assemble.dependsOn shadowJar
