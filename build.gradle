plugins {
    // Minecraft ships unobfuscated from 26.1 onwards. There are no mappings to apply,
    // so the no-remap flavour of Architectury Loom is used instead of the regular one.
    id 'dev.architectury.loom-no-remap' version '1.17.491' apply false
    id 'architectury-plugin' version '3.5.169'
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Suffixed jar names, e.g. `ribbits-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'GeckoLib'
                    url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
                }
            }
            filter { includeGroup('com.geckolib') }
        }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://maven.quiltmc.org/repository/release" }
    }

    dependencies {
        minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
    }

    java {
        withSourcesJar()

        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 25
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
        repositories {
            // Add repositories to publish to here.
        }
    }
}
